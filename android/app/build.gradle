plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.zoffline.solo'
    compileSdk 36

    defaultConfig {
        applicationId 'com.zoffline.solo'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        buildConfigField 'String', 'ZWIFT_PACKAGE', '"com.zwift.zwiftgame"'
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        jniLibs { useLegacyPackaging true }
        resources { excludes += ['META-INF/INDEX.LIST'] }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('ZOFFLINE_ANDROID_KEYSTORE')) {
                signingConfig signingConfigs.create('localRelease') {
                    storeFile file(System.getenv('ZOFFLINE_ANDROID_KEYSTORE'))
                    storePassword System.getenv('ZOFFLINE_ANDROID_STORE_PASSWORD')
                    keyAlias System.getenv('ZOFFLINE_ANDROID_KEY_ALIAS')
                    keyPassword System.getenv('ZOFFLINE_ANDROID_KEY_PASSWORD')
                }
            }
        }
    }
    lint { abortOnError true }
}

chaquopy {
    defaultConfig {
        version = '3.11'
        buildPython(System.getenv('ZOFFLINE_BUILD_PYTHON') ?: 'python')
        pip { install '-r', file('../../requirements-android.txt').absolutePath }
        pyc { src = false }
    }
}

tasks.register('prepareRuntime', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine(System.getenv('ZOFFLINE_BUILD_PYTHON') ?: 'python', 'scripts/prepare_android.py')
}
tasks.configureEach {
    if (name == 'preBuild' || name.startsWith('generate') && name.endsWith('PythonRequirements') ||
            name.startsWith('merge') && name.endsWith('PythonSources')) {
        dependsOn tasks.named('prepareRuntime')
    }
}

dependencies {
    implementation files('libs/hev-socks5-tunnel-2.19.3.aar')
    testImplementation 'junit:junit:4.13.2'
}
