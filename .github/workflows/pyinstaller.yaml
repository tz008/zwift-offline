name: pyinstaller

on:
  push:
    branches:
      - 'master'
    tags:
      - '*'

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Build executable
      run: .\build.cmd

    - name: Test Windows startup
      run: .\.venv-build\Scripts\python.exe -B -m unittest discover -s tests -v

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        path: dist/zoffline.exe
        if-no-files-found: error

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG_NAME: ${{ github.ref_name }}
      shell: bash
      run: |
        VERSION=$(xmllint --xpath "string(//Zwift/@sversion)" cdn/gameassets/Zwift_Updates_Root/Zwift_ver_cur.xml)
        cat << EOF > notes.md
        zoffline Windows only standalone executable for Zwift $VERSION.

        Note: The executable is made with pyinstaller. An unfortunate side effect is that some anti-virus software may falsely flag pyinstaller executables as malware. This is a [known issue](https://github.com/pyinstaller/pyinstaller/issues?q=is%3Aissue%20label%3Aantivirus-false-positives) and unavoidable. If you prefer, you can not use this exe and instead run zoffline directly from the source code (2nd installation method in the README).
        EOF
        if gh release view "$TAG_NAME" >/dev/null 2>&1; then
          gh release edit "$TAG_NAME" --title "zoffline for Zwift $VERSION" --notes-file notes.md
        else
          gh release create "$TAG_NAME" --title "zoffline for Zwift $VERSION" --notes-file notes.md
        fi
        gh release upload "$TAG_NAME" dist/zoffline.exe --clobber
